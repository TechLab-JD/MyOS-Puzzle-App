<div class="app-window" id="PuzzleApp">
  <div class="app-header"><span class="app-title">🧩 15 Puzzle</span><div class="app-controls"><button class="minimize-btn">–</button><button class="close-btn">×</button></div></div>
  <div class="app-content">
    <div class="pz">
      <div class="pz-bar"><span>Moves: <b id="pz-mv">0</b></span><span>Time: <b id="pz-time">0:00</b></span><button id="pz-shuf">Shuffle</button></div>
      <div id="pz-board" class="pz-board"></div>
      <div id="pz-msg" class="pz-msg"></div>
    </div>
  </div>
  <div class="resize-handle"></div>
</div>
